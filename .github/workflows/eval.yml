name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the eval suite (demo mode)
        working-directory: eval
        run: python run.py
      - name: Run the guardian and early-warning demos
        run: |
          python guardian/guardian.py
          python psychosis/early_warning.py
      - name: Smoke tests (standard library only)
        run: python -m unittest discover -s tests -v

  hub-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: hub-validator
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: hub-validator
        env:
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest -q
